<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tiffin Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f1;
    --surface: #ffffff;
    --surface-2: #f3f0e6;
    --ink: #22281c;
    --muted: #5f6b57;
    --border: #e6e1d3;
    --accent: #c97b2e;
    --accent-ink: #4a2c0e;
    --accent-soft: #f3e2cc;
    --leaf: #4c7a52;
    --leaf-soft: #e2ecdf;
    --danger: #b3452f;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(34,40,28,0.06), 0 8px 24px -12px rgba(34,40,28,0.18);
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Karla", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14170f;
      --surface: #1c2016;
      --surface-2: #242a1c;
      --ink: #efebdd;
      --muted: #a7b29b;
      --border: #333a2a;
      --accent: #e3a857;
      --accent-ink: #2c1c0a;
      --accent-soft: #3a2c17;
      --leaf: #82b686;
      --leaf-soft: #263323;
      --danger: #e08066;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14170f;
    --surface: #1c2016;
    --surface-2: #242a1c;
    --ink: #efebdd;
    --muted: #a7b29b;
    --border: #333a2a;
    --accent: #e3a857;
    --accent-ink: #2c1c0a;
    --accent-soft: #3a2c17;
    --leaf: #82b686;
    --leaf-soft: #263323;
    --danger: #e08066;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3 {
    font-family: var(--font-display);
    text-wrap: balance;
    margin: 0 0 0.4em;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  p { margin: 0 0 1em; }
  button { font-family: inherit; }
  input, select, textarea {
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--surface);
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 48px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .brandbar {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 6px 2px 22px;
  }
  .brandbar .mark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.15rem;
    color: var(--ink);
  }
  .brandbar .mark span { color: var(--accent); }
  .brandbar .tag {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .progress-track {
    height: 6px;
    border-radius: 99px;
    background: var(--surface-2);
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--leaf);
    border-radius: 99px;
    transition: width 0.35s ease;
  }
  .progress-label {
    font-size: 0.76rem;
    color: var(--muted);
    margin-bottom: 22px;
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 320px;
  }

  .eyebrow {
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--leaf);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .step-title { font-size: 1.4rem; margin-bottom: 6px; }
  .step-sub { color: var(--muted); font-size: 0.94rem; margin-bottom: 20px; }

  .concept-box {
    background: var(--leaf-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 16px;
    font-size: 0.96rem;
    color: var(--ink);
    margin-bottom: 20px;
    font-style: italic;
  }

  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field label.field-label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 7px;
    color: var(--ink);
  }
  .field .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 5px;
  }
  .text-input, .textarea-input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
  }
  .textarea-input { resize: vertical; min-height: 72px; }

  .price-row {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
    background: var(--surface);
  }
  .price-row .rs {
    padding: 11px 10px;
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 600;
    border-right: 1px solid var(--border);
  }
  .price-row input {
    border: none;
    padding: 11px 13px;
    flex: 1;
    min-width: 0;
    font-variant-numeric: tabular-nums;
    background: transparent;
  }
  .price-row input:focus { outline: none; }
  .price-row:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .option-list { display: flex; flex-direction: column; gap: 9px; }
  .option {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    background: var(--surface);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option input { accent-color: var(--accent); width: 17px; height: 17px; flex-shrink: 0; }
  .option.checked { border-color: var(--accent); background: var(--accent-soft); }
  .option .option-text { font-size: 0.95rem; }

  .scale-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .scale-pill {
    flex: 1 1 auto;
    min-width: 62px;
    text-align: center;
    padding: 10px 6px;
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.78rem;
    line-height: 1.25;
    background: var(--surface);
  }
  .scale-pill.checked { border-color: var(--leaf); background: var(--leaf-soft); font-weight: 700; }

  .rank-list { display: flex; flex-direction: column; gap: 9px; }
  .rank-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    background: var(--surface);
  }
  .rank-item.ranked { border-color: var(--leaf); background: var(--leaf-soft); }
  .rank-badge {
    width: 26px; height: 26px;
    border-radius: 99px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
    background: var(--surface);
  }
  .rank-item.ranked .rank-badge {
    background: var(--leaf);
    border-color: var(--leaf);
    color: #fff;
  }
  .rank-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .reset-link {
    background: none; border: none; color: var(--accent);
    font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 4px;
    text-decoration: underline;
  }
  .other-input { margin-top: 8px; }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 4px;
  }
  .btn {
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 0.96rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid transparent;
    flex: 1;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); flex: 0 0 auto; }
  .btn-primary:not(:disabled):active { transform: translateY(1px); }

  .error-msg {
    color: var(--danger);
    font-size: 0.82rem;
    margin-top: 10px;
  }

  .intro-emoji { font-size: 2.2rem; margin-bottom: 6px; }

  .thanks-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 6px;
    padding: 20px 6px;
  }
  .thanks-check {
    width: 56px; height: 56px;
    border-radius: 99px;
    background: var(--leaf-soft);
    color: var(--leaf);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    margin-bottom: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app" class="shell"></div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://evqwpzjqqnbrfjhorkyb.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_jml-i47gf4-VgiCBRn9_8A_gUQcJJYD";

  var CONCERN_ITEMS = [
    { id: "picky", label: "Picky eating" },
    { id: "immunity", label: "Immunity" },
    { id: "height", label: "Height & growth" },
    { id: "focus", label: "Concentration & focus in studies" },
    { id: "unsure", label: "Not sure if they're getting enough vitamins" },
    { id: "other", label: "Other" }
  ];

  var REASON_OPTIONS = [
    { id: "pediatrician", label: "Pediatrician recommended" },
    { id: "picky", label: "Picky eating" },
    { id: "immunity", label: "Immunity concern" },
    { id: "referral", label: "Friend / family suggested" },
    { id: "other", label: "Other" }
  ];

  var APPEAL_OPTIONS = [
    { id: "5", label: "Very appealing" },
    { id: "4", label: "Somewhat appealing" },
    { id: "3", label: "Neutral" },
    { id: "2", label: "Not very appealing" },
    { id: "1", label: "Not at all appealing" }
  ];

  var FORMAT_OPTIONS = [
    { id: "gummies", label: "Gummies" },
    { id: "chewable", label: "Chewable tablets" },
    { id: "powder", label: "Powder (mix into water, milk or food)" },
    { id: "syrup", label: "Syrup / drops" },
    { id: "other", label: "Other" }
  ];

  function usesSupplement(a) {
    return a.supplementUse === "regularly" || a.supplementUse === "occasionally";
  }

  var STEPS = [
    {
      id: "intro",
      visible: function () { return true; },
      render: function () {
        return (
          '<div class="intro-emoji">🌱</div>' +
          '<h1 class="step-title">Quick 3-minute survey</h1>' +
          '<p class="step-sub">We\'re building a better kids\' nutrition brand for India, and want your honest take before we build anything. No right or wrong answers &mdash; just tell us how it really is in your house.</p>'
        );
      },
      validate: function () { return null; }
    },
    {
      id: "household",
      visible: function () { return true; },
      render: function (a) {
        return (
          '<div class="eyebrow">About your household</div>' +
          '<h2 class="step-title">Tell us a bit about your family</h2>' +
          field_text("city", "Which city or town do you live in?", a.city, "e.g. Pune") +
          field_text("ages", "List the ages of all your children", a.ages, "e.g. 2, 6, 9") +
          field_radio("diet", "Is your household vegetarian, non-vegetarian, or mixed?", [
            { id: "veg", label: "Vegetarian" },
            { id: "nonveg", label: "Non-vegetarian" },
            { id: "mixed", label: "Mixed (some members veg, some not)" }
          ], a.diet)
        );
      },
      validate: function (a) {
        if (!a.city || !a.city.trim()) return "Please tell us your city or town.";
        if (!a.ages || !a.ages.trim()) return "Please list your children's ages.";
        if (!a.diet) return "Please pick one option.";
        return null;
      }
    },
    {
      id: "supplementUse",
      visible: function () { return true; },
      render: function (a) {
        return (
          '<div class="eyebrow">Current behavior</div>' +
          '<h2 class="step-title">Does your child currently take any vitamin or nutrition supplement?</h2>' +
          field_radio("supplementUse", null, [
            { id: "regularly", label: "Yes, regularly" },
            { id: "occasionally", label: "Yes, occasionally" },
            { id: "no", label: "No" }
          ], a.supplementUse)
        );
      },
      validate: function (a) { return a.supplementUse ? null : "Please pick one option."; }
    },
    {
      id: "brandSpend",
      visible: function (a) { return usesSupplement(a); },
      render: function (a) {
        return (
          '<div class="eyebrow">Current behavior</div>' +
          '<h2 class="step-title">Which brand, and roughly how much do you spend per month?</h2>' +
          field_text("brand", "Brand name", a.brand, "e.g. Gritzo") +
          field_text("spend", "Approx. monthly spend (₹)", a.spend, "e.g. 600")
        );
      },
      validate: function (a) {
        if (!a.brand || !a.brand.trim()) return "Please tell us the brand.";
        if (!a.spend || !a.spend.trim()) return "Please give a rough monthly spend.";
        return null;
      }
    },
    {
      id: "reason",
      visible: function (a) { return usesSupplement(a); },
      render: function (a) {
        var html =
          '<div class="eyebrow">Current behavior</div>' +
          '<h2 class="step-title">What\'s the main reason you started giving it?</h2>' +
          field_radio("reason", null, REASON_OPTIONS, a.reason);
        if (a.reason === "other") {
          html += field_text("reasonOther", "Please specify", a.reasonOther, "Your reason");
        }
        return html;
      },
      validate: function (a) {
        if (!a.reason) return "Please pick one option.";
        if (a.reason === "other" && (!a.reasonOther || !a.reasonOther.trim())) return "Please specify your reason.";
        return null;
      }
    },
    {
      id: "concerns",
      visible: function () { return true; },
      render: function (a) {
        var ranks = a.concernRanks || {};
        var rankedCount = Object.keys(ranks).length;
        var html =
          '<div class="eyebrow">Concerns</div>' +
          '<h2 class="step-title">Rank these by how much you worry about them for your child</h2>' +
          '<p class="step-sub">Tap in order &mdash; 1st tap = what worries you most.</p>' +
          '<div class="rank-meta"><span>' + rankedCount + ' of ' + CONCERN_ITEMS.length + ' ranked</span>' +
          '<button type="button" class="reset-link" data-action="reset-ranks">Reset</button></div>' +
          '<div class="rank-list">';
        CONCERN_ITEMS.forEach(function (item) {
          var rank = ranks[item.id];
          html +=
            '<div class="rank-item ' + (rank ? "ranked" : "") + '" data-action="toggle-rank" data-rank-id="' + item.id + '">' +
            '<span class="rank-badge">' + (rank || "") + '</span>' +
            '<span class="option-text">' + item.label + '</span>' +
            '</div>';
        });
        html += '</div>';
        if (ranks.other) {
          html += '<div class="other-input">' + field_text("concernOther", "Please specify “Other”", a.concernOther, "Your concern") + '</div>';
        }
        return html;
      },
      validate: function (a) {
        var ranks = a.concernRanks || {};
        var required = CONCERN_ITEMS.filter(function (item) { return item.id !== "other"; }).length;
        if (Object.keys(ranks).filter(function (id) { return id !== "other"; }).length < required) {
          return "Please rank every item (tap each one once) &mdash; “Other” is optional.";
        }
        return null;
      }
    },
    {
      id: "concept",
      visible: function () { return true; },
      render: function (a) {
        return (
          '<div class="eyebrow">A new idea</div>' +
          '<h2 class="step-title">Here\'s a concept we\'re considering</h2>' +
          '<div class="concept-box">Imagine a kids’ vitamin brand that’s radically transparent &mdash; publishing every ingredient and dose on its website with the actual science behind it &mdash; is designed around the real nutrition gaps common in Indian children’s diets, and never makes exaggerated height or brain claims.</div>' +
          field_radio("appeal", "How appealing is this concept to you?", APPEAL_OPTIONS, a.appeal, true) +
          field_textarea("appealReason", "What’s the main reason for your answer? (optional)", a.appealReason, "Whatever comes to mind")
        );
      },
      validate: function (a) {
        if (!a.appeal) return "Please pick how appealing this feels.";
        return null;
      }
    },
    {
      id: "barrier",
      visible: function () { return true; },
      render: function (a) {
        var yes = usesSupplement(a);
        var title = yes
          ? "What would make you hesitant to switch to a new brand like this? (optional)"
          : "What would make you consider trying a supplement like this for the first time? (optional)";
        return (
          '<div class="eyebrow">Honest friction</div>' +
          '<h2 class="step-title">' + title + '</h2>' +
          field_textarea("barrier", null, a.barrier, "Type freely &mdash; this is the part we read most closely")
        );
      },
      validate: function () { return null; }
    },
    {
      id: "pricing",
      visible: function () { return true; },
      render: function (a) {
        return (
          '<div class="eyebrow">Pricing</div>' +
          '<h2 class="step-title">Thinking about that concept, help us with 4 quick prices</h2>' +
          price_field("priceTooExpensive", "So expensive you wouldn’t consider it", a.priceTooExpensive) +
          price_field("priceExpensive", "Feels expensive, but you’d still consider it", a.priceExpensive) +
          price_field("priceGoodValue", "Feels like good value", a.priceGoodValue) +
          price_field("priceTooCheap", "So cheap you’d worry about quality", a.priceTooCheap) +
          '<p class="hint">All amounts are per month, in rupees.</p>'
        );
      },
      validate: function (a) {
        var fields = ["priceTooExpensive", "priceExpensive", "priceGoodValue", "priceTooCheap"];
        for (var i = 0; i < fields.length; i++) {
          var v = a[fields[i]];
          if (!v || isNaN(Number(v)) || Number(v) <= 0) return "Please fill in all four prices as numbers.";
        }
        return null;
      }
    },
    {
      id: "format",
      visible: function () { return true; },
      render: function (a) {
        var html =
          '<div class="eyebrow">Format</div>' +
          '<h2 class="step-title">Which format would you most prefer for your child?</h2>' +
          field_radio("formatPref", null, FORMAT_OPTIONS, a.formatPref);
        if (a.formatPref === "other") {
          html += field_text("formatOther", "Please specify", a.formatOther, "Your preferred format");
        }
        return html;
      },
      validate: function (a) {
        if (!a.formatPref) return "Please pick one option.";
        if (a.formatPref === "other" && (!a.formatOther || !a.formatOther.trim())) return "Please specify the format.";
        return null;
      }
    },
    {
      id: "contact",
      visible: function () { return true; },
      render: function (a) {
        return (
          '<div class="eyebrow">Last thing</div>' +
          '<h2 class="step-title">Can we reach out again as we build this?</h2>' +
          '<p class="step-sub">Totally optional &mdash; skip if you’d rather not.</p>' +
          field_text("contactName", "Name", a.contactName, "Optional") +
          field_text("contactInfo", "WhatsApp number or email", a.contactInfo, "Optional") +
          '<p class="hint">We only use this to follow up about this project &mdash; never shared with anyone else, no spam.</p>'
        );
      },
      validate: function () { return null; }
    }
  ];

  function field_text(name, label, value, placeholder) {
    return (
      '<div class="field">' +
      (label ? '<label class="field-label">' + label + '</label>' : '') +
      '<input class="text-input" type="text" data-field="' + name + '" value="' + escapeAttr(value || "") + '" placeholder="' + escapeAttr(placeholder || "") + '" />' +
      '</div>'
    );
  }

  function field_textarea(name, label, value, placeholder) {
    return (
      '<div class="field">' +
      (label ? '<label class="field-label">' + label + '</label>' : '') +
      '<textarea class="textarea-input" data-field="' + name + '" placeholder="' + escapeAttr(placeholder || "") + '">' + escapeHtml(value || "") + '</textarea>' +
      '</div>'
    );
  }

  function field_radio(name, label, options, current, isScale) {
    var wrapClass = isScale ? "scale-row" : "option-list";
    var html = '<div class="field">' + (label ? '<label class="field-label">' + label + '</label>' : '') + '<div class="' + wrapClass + '">';
    options.forEach(function (opt) {
      var checked = current === opt.id;
      if (isScale) {
        html +=
          '<div class="scale-pill ' + (checked ? "checked" : "") + '" data-action="set-radio" data-field="' + name + '" data-value="' + opt.id + '">' +
          opt.label + '</div>';
      } else {
        html +=
          '<label class="option ' + (checked ? "checked" : "") + '" data-action="set-radio" data-field="' + name + '" data-value="' + opt.id + '">' +
          '<input type="radio" name="' + name + '" ' + (checked ? "checked" : "") + ' readonly />' +
          '<span class="option-text">' + opt.label + '</span></label>';
      }
    });
    html += '</div></div>';
    return html;
  }

  function price_field(name, label, value) {
    return (
      '<div class="field">' +
      '<label class="field-label">' + label + '</label>' +
      '<div class="price-row"><span class="rs">₹</span><input type="number" inputmode="numeric" min="0" data-field="' + name + '" value="' + escapeAttr(value || "") + '" placeholder="0" /></div>' +
      '</div>'
    );
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escapeAttr(str) { return escapeHtml(str); }

  var state = { stepIndex: 0, answers: {} };
  var submitting = false;
  var submitError = "";
  var submittedOk = false;

  function activeSteps() { return STEPS.filter(function (s) { return s.visible(state.answers); }); }

  function render() {
    var app = document.getElementById("app");

    if (submittedOk) {
      app.innerHTML = renderThanks();
      return;
    }

    var steps = activeSteps();
    var step = steps[state.stepIndex];
    var pct = Math.round(((state.stepIndex) / (steps.length - 1)) * 100);

    var html =
      '<div class="brandbar"><span class="mark">Tiffin<span>Talk</span></span><span class="tag">parent survey</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label">Step ' + (state.stepIndex + 1) + ' of ' + steps.length + '</div>' +
      '<div class="card">' +
      step.render(state.answers) +
      (submitError ? '<div class="error-msg">' + escapeHtml(submitError) + '</div>' : '') +
      '<div class="nav-row">' +
      (state.stepIndex > 0 ? '<button type="button" class="btn btn-ghost" data-action="back">Back</button>' : '') +
      '<button type="button" class="btn btn-primary" data-action="next" ' + (submitting ? "disabled" : "") + '>' +
      (state.stepIndex === steps.length - 1 ? (submitting ? "Sending…" : "Submit") : "Next") +
      '</button>' +
      '</div>' +
      '</div>';

    app.innerHTML = html;
    bindStepInputs();
  }

  function renderThanks() {
    return (
      '<div class="brandbar"><span class="mark">Tiffin<span>Talk</span></span><span class="tag">parent survey</span></div>' +
      '<div class="card"><div class="thanks-wrap">' +
      '<div class="thanks-check">✓</div>' +
      '<h1 class="step-title">Thank you!</h1>' +
      '<p class="step-sub">Your answers were saved. This genuinely helps us build the right thing before we build anything at all.</p>' +
      '</div></div>'
    );
  }

  function bindStepInputs() {
    var app = document.getElementById("app");
    app.querySelectorAll('[data-field]').forEach(function (el) {
      if (el.tagName === "INPUT" && (el.type === "text" || el.type === "number")) {
        el.addEventListener("input", function () {
          state.answers[el.getAttribute("data-field")] = el.value;
        });
      }
      if (el.tagName === "TEXTAREA") {
        el.addEventListener("input", function () {
          state.answers[el.getAttribute("data-field")] = el.value;
        });
      }
    });
    app.querySelectorAll('[data-action="set-radio"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var field = el.getAttribute("data-field");
        var value = el.getAttribute("data-value");
        state.answers[field] = value;
        render();
      });
    });
    var resetBtn = app.querySelector('[data-action="reset-ranks"]');
    if (resetBtn) {
      resetBtn.addEventListener("click", function () {
        state.answers.concernRanks = {};
        render();
      });
    }
    app.querySelectorAll('[data-action="toggle-rank"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-rank-id");
        var ranks = state.answers.concernRanks || {};
        if (ranks[id]) {
          delete ranks[id];
        } else {
          var next = Object.keys(ranks).length + 1;
          ranks[id] = next;
        }
        state.answers.concernRanks = ranks;
        render();
      });
    });
    var backBtn = app.querySelector('[data-action="back"]');
    if (backBtn) backBtn.addEventListener("click", function () { submitError = ""; state.stepIndex -= 1; render(); });
    var nextBtn = app.querySelector('[data-action="next"]');
    if (nextBtn) nextBtn.addEventListener("click", onNext);
  }

  function onNext() {
    var steps = activeSteps();
    var step = steps[state.stepIndex];
    var err = step.validate(state.answers);
    if (err) { submitError = err; render(); return; }
    submitError = "";
    if (state.stepIndex < steps.length - 1) {
      state.stepIndex += 1;
      render();
    } else {
      submitResponse();
    }
  }

  function buildResponseObject() {
    var a = state.answers;
    var ranks = a.concernRanks || {};
    return {
      city: a.city || "", ages: a.ages || "", diet: a.diet || "",
      supplement_use: a.supplementUse || "",
      brand: a.brand || "", spend: a.spend || "",
      reason: a.reason || "", reason_other: a.reasonOther || "",
      concern_ranks: ranks, concern_other: a.concernOther || "",
      appeal: a.appeal || "", appeal_reason: a.appealReason || "",
      barrier: a.barrier || "",
      price_too_expensive: a.priceTooExpensive || "", price_expensive: a.priceExpensive || "",
      price_good_value: a.priceGoodValue || "", price_too_cheap: a.priceTooCheap || "",
      format_pref: a.formatPref || "", format_other: a.formatOther || "",
      contact_name: a.contactName || "", contact_info: a.contactInfo || ""
    };
  }

  async function submitResponse() {
    submitting = true;
    submitError = "";
    render();

    var responseObj = buildResponseObject();

    try {
      var res = await fetch(SUPABASE_URL + "/rest/v1/survey_responses", {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(responseObj)
      });
      if (!res.ok) {
        var bodyText = "";
        try { bodyText = await res.text(); } catch (e2) {}
        throw new Error("HTTP " + res.status + (bodyText ? ": " + bodyText : ""));
      }
      submitting = false;
      submittedOk = true;
      render();
    } catch (e) {
      submitting = false;
      submitError = "Couldn't save your response. Please check your connection and tap Submit again.";
      render();
    }
  }

  function main() {
    render();
  }

  main();
})();
</script>
</body>
</html>
